server {
    listen 80;
    server_name moodjournal.ru www.moodjournal.ru;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect HTTP to HTTPS on API port
    location / {
        return 301 https://$host:444$request_uri;
    }
}

server {
    listen 444 ssl;
    server_name moodjournal.ru www.moodjournal.ru;

    # SSL certificates (will be created by certbot)
    ssl_certificate /etc/letsencrypt/live/moodjournal.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/moodjournal.ru/privkey.pem;

    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Proxy to Node.js
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
